services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana

  mock-server:
    image: denoland/deno:2.1.4
    container_name: autotrack-mock-server
    working_dir: /app
    volumes:
      - ../../mock-server:/app:ro
    command: run --allow-net --allow-read --allow-env server.ts
    # Replay a telemetry_node CSV instead of the default JSON run, e.g. the 23 Nov track day:
    # environment:
    #   - DATA_FILE=./data/23kasim/00_tam_kayit_23kasim.csv
    ports:
      - '8080:8080'
