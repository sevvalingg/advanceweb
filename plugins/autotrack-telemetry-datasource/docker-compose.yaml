services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana

  mock-server:
    image: denoland/deno:2.1.4
    container_name: autotrack-mock-server
    working_dir: /app
    volumes:
      - ../../mock-server:/app:ro
    command: run --allow-net --allow-read --allow-env server.ts
    ports:
      - '8080:8080'
